[project]
name = "sabre-factory"
version = "0.1.0"
license = "MIT"
description = "Personal software factory driven by LangGraph"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.162.0", "pydantic==2.14.1", "pydantic-settings>=2.10,<3",
  "langgraph==1.2.18", "langchain==1.4.7", "langchain-openai==1.7.3",
  "langchain-anthropic==1.7.7", "langchain-google-genai==4.4.2",
  "langgraph-checkpoint-postgres==3.2.0", "mcp==2.3.0", "a2a-sdk[http-server]==1.3.0",
  "psycopg[binary,pool]>=3.2,<4", "procrastinate==3.10.0",
  "httpx>=0.28,<1", "httpx2==2.16.0", "uvicorn>=0.35,<1", "slack-bolt>=1.23,<2",
  "aiohttp>=3.12,<4", "opentelemetry-sdk==1.45.2",
  "opentelemetry-exporter-otlp-proto-http==1.45.2", "docker>=7.1,<8",
  "PyYAML==6.0.3", "jsonschema>=4.25,<5", "pgvector>=0.4,<1", "packaging>=25,<27", "cryptography==50.0.2"
]

[dependency-groups]
dev = ["types-PyYAML>=6,<7", "pytest>=8.4,<10", "pytest-asyncio>=1.1,<2", "ruff>=0.13,<1", "mypy>=1.18,<2"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sabre"]

[tool.uv]
# CVE-2026-126360: include the patched OTel family released after the original lock cutoff.
exclude-newer-package = { opentelemetry-api = "2026-10-30T00:00:00Z", opentelemetry-sdk = "2026-10-30T00:00:00Z", opentelemetry-exporter-otlp-proto-http = "2026-10-30T00:00:00Z", opentelemetry-exporter-otlp-proto-common = "2026-10-30T00:00:00Z", opentelemetry-exporter-otlp-common = "2026-10-30T00:00:00Z", opentelemetry-exporter-http-transport = "2026-10-30T00:00:00Z", opentelemetry-proto = "2026-10-30T00:00:00Z", opentelemetry-semantic-conventions = "2026-10-30T00:00:00Z" }
build-constraint-dependencies = [
  "hatchling==1.33.0", "packaging==26.3", "pathspec==1.1.1",
  "pluggy==1.7.0", "tomlkit==0.15.2", "trove-classifiers==2026.9.21.13"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]
"integration/**" = ["S101", "S105", "S106", "S108"]
"native_checks/**" = ["S101", "S105", "S106", "S108"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
ignore_missing_imports = true
