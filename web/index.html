<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171c27" />
    <meta name="description" content="SABRE control room for your local software factory." />
    <title>SABRE · Agent console</title>
    <!-- Apply the stored colour theme before the first paint; mirrors src/lib/theme.ts. -->
    <script>
      try {
        var theme = localStorage.getItem('sabre.theme');
        if (
          theme === 'light' ||
          (theme === 'system' && matchMedia('(prefers-color-scheme: light)').matches)
        ) {
          document.documentElement.classList.add('light');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f7f8fa');
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
