http_port 3128
acl security_feeds dstdomain ghcr.io .pkg-containers.githubusercontent.com
acl CONNECT method CONNECT
acl SSL_ports port 443
acl Safe_ports port 443
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow security_feeds
http_access deny all
cache deny all
cache_mem 8 MB
pinger_enable off
access_log none
cache_log /dev/stderr
cache_store_log none
pid_filename /tmp/squid.pid
coredump_dir /tmp
visible_hostname sabre-security-updates
