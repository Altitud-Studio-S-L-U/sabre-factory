rules:
  - id: sabre.python.dynamic-code
    languages: [python]
    message: Dynamic code evaluation requires an explicit security review.
    severity: ERROR
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)
    metadata:
      category: security
      cwe: CWE-95
      confidence: MEDIUM
  - id: sabre.python.shell-subprocess
    languages: [python]
    message: Shell subprocess execution requires an explicit security review.
    severity: ERROR
    pattern-either:
      - pattern: subprocess.run(..., shell=True, ...)
      - pattern: subprocess.Popen(..., shell=True, ...)
      - pattern: subprocess.call(..., shell=True, ...)
      - pattern: subprocess.check_call(..., shell=True, ...)
      - pattern: subprocess.check_output(..., shell=True, ...)
    metadata:
      category: security
      cwe: CWE-78
      confidence: MEDIUM
  - id: sabre.javascript.dynamic-code
    languages: [javascript, typescript]
    message: Dynamic code evaluation requires an explicit security review.
    severity: ERROR
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
    metadata:
      category: security
      cwe: CWE-95
      confidence: MEDIUM
